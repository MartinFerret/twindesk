name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  bash:
    name: Bash (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install ShellCheck and bats
        run: |
          if [ "$RUNNER_OS" = macOS ]; then brew install shellcheck; else sudo apt-get update && sudo apt-get install -y shellcheck sqlite3; fi
          git clone --depth 1 --branch v1.11.0 https://github.com/bats-core/bats-core.git "$RUNNER_TEMP/bats"
      - name: Show the bash used for tests
        run: /bin/bash --version | head -n 1
      - name: ShellCheck
        run: shellcheck -x twindesk install.sh scripts/bump-formula.sh test/helpers.bash
      - name: Bash syntax with system bash
        run: /bin/bash -n twindesk && /bin/bash -n install.sh && /bin/bash -n scripts/bump-formula.sh
      - name: Unit tests (bats, script run by /bin/bash)
        run: TD_BASH=/bin/bash "$RUNNER_TEMP/bats/bin/bats" test/

  powershell:
    name: PowerShell (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Pester and PSScriptAnalyzer
        shell: pwsh
        run: |
          # PowerShell Gallery downloads fail now and then: retry before giving up.
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          foreach ($m in @(@{ Name = 'Pester'; Version = '5.6.1' }, @{ Name = 'PSScriptAnalyzer'; Version = '1.22.0' })) {
            for ($i = 1; $i -le 3; $i++) {
              try { Install-Module $m.Name -RequiredVersion $m.Version -Scope CurrentUser -Force -SkipPublisherCheck -ErrorAction Stop; break }
              catch { if ($i -eq 3) { throw }; Write-Warning "attempt $i failed: $($_.Exception.Message)"; Start-Sleep -Seconds (10 * $i) }
            }
          }
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          $r = 'twindesk.ps1', 'install.ps1', 'test/twindesk.Tests.ps1' | ForEach-Object { Invoke-ScriptAnalyzer -Path $_ -Settings ./PSScriptAnalyzerSettings.psd1 }
          $r | Format-Table -AutoSize RuleName, Severity, ScriptName, Line, Message
          if (@($r).Count -gt 0) { exit 1 }
      - name: Pester (PowerShell 7)
        shell: pwsh
        run: |
          $c = New-PesterConfiguration
          $c.Run.Path = 'test'
          $c.Run.Exit = $true
          $c.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $c
      - name: Pester (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          for ($i = 1; $i -le 3; $i++) {
            try { Install-Module Pester -RequiredVersion 5.6.1 -Scope CurrentUser -Force -SkipPublisherCheck -ErrorAction Stop; break }
            catch { if ($i -eq 3) { throw }; Write-Warning "attempt $i failed: $($_.Exception.Message)"; Start-Sleep -Seconds (10 * $i) }
          }
          Import-Module Pester -RequiredVersion 5.6.1
          $c = New-PesterConfiguration
          $c.Run.Path = 'test'
          $c.Run.Exit = $true
          $c.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $c
